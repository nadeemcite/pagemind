name: PageMind release

# Push a tag equal to [pagemind] version in platformio.fork.ini (e.g. 0.1.0,
# no "v") to build the firmware and publish a GitHub release. Devices running
# PageMind update from the latest non-prerelease release.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: pagemind_x4pro_release
            device: x4pro
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check tag matches the fork version
        run: |
          configured="$(sed -n 's/^version = //p' platformio.fork.ini | head -n1)"
          echo "tag=${GITHUB_REF_NAME} configured=${configured}"
          test "${GITHUB_REF_NAME}" = "${configured}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.env }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build
        run: pio run -e "${{ matrix.env }}" -j1

      - name: Prepare firmware asset
        id: asset
        run: |
          asset="pagemind-${GITHUB_REF_NAME}-${{ matrix.device }}.bin"
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "$asset"
          sha256sum "$asset" | tee "$asset.sha256"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "PageMind ${GITHUB_REF_NAME}" \
              --notes "PageMind ${GITHUB_REF_NAME} for Xteink X4 Pro. Based on CrossPoint Reader; not an official CrossPoint release. Install and setup: see the README."
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber

[project]
name = "crosspoint-ai-proxy"
version = "0.1.0"
description = "Small AI proxy for the CrossPoint e-reader: the device sends selected text, the proxy calls the AI provider."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.50",
    "ollama>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

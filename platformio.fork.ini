; PageMind build environments. Kept out of platformio.ini so upstream
; merges rarely conflict. Build with:  pio run -e pagemind_x4pro

[pagemind]
; Release tags must equal this version exactly (no "v" prefix), e.g. 0.1.0.
version = 0.2.0
; SHA-384/512 for TLS certificate checks. Cloud Run now serves an ECDSA chain
; (WE2 <- GTS Root R4) signed with ecdsa-with-SHA384; without these wolfSSL
; fails the handshake with HASH_TYPE_E (-232).
build_flags =
  -DWOLFSSL_SHA384
  -DWOLFSSL_SHA512

; Development build: version "<version>-dev-<sha>", debug logging.
[env:pagemind_x4pro]
extends = env:x4pro
build_flags =
  ${env:x4pro.build_flags}
  ${pagemind.build_flags}
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/fork_version.py

; Release build used by .github/workflows/fork-release.yml.
[env:pagemind_x4pro_release]
extends = env:x4pro-gh_release
custom_fork_release = yes
build_flags =
  ${env:x4pro-gh_release.build_flags}
  ${pagemind.build_flags}
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/fork_version.py

; Demo capture build (scripts/demo_capture.py): development build plus the
; PAGEMIND_DEMO serial commands. Never released.
[env:pagemind_x4pro_demo]
extends = env:pagemind_x4pro
build_flags =
  ${env:pagemind_x4pro.build_flags}
  -DPAGEMIND_DEMO=1

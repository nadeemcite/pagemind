# PageMind demo capture storyboard (scripts/demo_capture.py).
# Books are public domain; copy demo/books/*.epub to "/PageMind Demo/" on the SD card.
# Word indices in `select` count words on the page from 0. Adjust `page` and
# `select` after a first run by looking at demo/out/raw/*.png.

output: out
settle_seconds: 2.5

books:
  english: /PageMind Demo/A Tale of Two Cities.epub
  hindi: /PageMind Demo/Panch Parmeshwar - Premchand.epub

scenes:
  - name: reading
    caption: Reading as usual
    steps:
      - open: english
      - goto: [2, 1]
      - shot: 01-reading

  - name: select
    caption: Select a passage and tap Ask AI
    steps:
      - select: [4, 27]
      - mark: askai
      - shot: 02-select

  - name: picker
    caption: Choose what you need
    steps:
      - picker: true
      - mark: option 0
      - shot: 03-picker
      - back: true

  - name: explain
    caption: The answer, right on the page
    steps:
      - open: english
      - goto: [2, 1]
      - language: English
      - select: [4, 27]
      - ask: explain
      - shot: 04-explain
      - back: true

  - name: define
    caption: Words defined in context
    steps:
      - open: english
      - goto: [2, 1]
      - language: English
      - select: [39, 39]
      - ask: define
      - shot: 05-define
      - back: true

  - name: other-language
    caption: Read in any language
    steps:
      - open: hindi
      - goto: [1, 0]
      - shot: 06-other-language

  - name: translate-english
    caption: Translated into yours
    steps:
      - language: English
      - select: [7, 29]
      - ask: translate
      - shot: 07-translate-english
      - back: true

  - name: answer-spanish
    caption: Answers in the language you choose
    steps:
      - open: english
      - goto: [2, 1]
      - language: Spanish
      - select: [4, 27]
      - ask: explain
      - shot: 08-answer-spanish
      - back: true

composites:
  hero: [01-reading, 04-explain]
  steps: [02-select, 03-picker, 04-explain, 05-define]
  languages: [06-other-language, 07-translate-english, 08-answer-spanish]

captions:
  hero: Ask your e-reader about what you are reading
  steps: Select, ask, read
  languages: Any book, any language
